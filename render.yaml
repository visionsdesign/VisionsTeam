services:
  - type: web
    name: visionsteam-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLICKUP_API_KEY
        sync: false
      - key: HUBSTAFF_CLIENT_ID
        sync: false
      - key: HUBSTAFF_CLIENT_SECRET
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
